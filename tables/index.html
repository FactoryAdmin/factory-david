<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <!-- <link rel="stylesheet" href="./css/style.css"> -->
    <title>Table</title>
    <style>

    </style>
</head>

<body class="bg-light">
    <header class="container-fluid d-flex justify-content-between p-4">
        <h1>Lista de Usuarios</h1>
        <button type="button" class="btn btn-danger">Salir</button>
    </header>
    <div class="container-fluid p-3">
        <table id="mainTable" class="container text-center table table-striped table-hover">
            <thead>
                <th class="w-10">ID</th>
                <th class="w-20">USUARIO</th>
                <th class="w-20">EDAD</th>
                <th class="w-20">EMAIL</th>
                <th class="w-30">ACCIONES</th>
            </thead>
            <tbody id="tbodyMainTable">

            </tbody>
        </table>

        <div id="pagination-container" class="d-flex justify-content-center"></div>
    </div>



    <!-- Delete Modal -->
    <div class="modal fade" id="confirmDeleteModal" tabindex="-1" aria-labelledby="exampleModalLabel"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">Eliminar usuario</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    ¿Desea eliminar el usuario ID <span id="userId"></span>?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="button" class="btn btn-danger" id="deleteBtn" data-bs-dismiss="modal">Eliminar</button>
                </div>
            </div>
        </div>
    </div>


    <!-- Modify Modal -->
    <div class="modal fade" id="confirmModifyModal" tabindex="-1" aria-labelledby="exampleModalLabel"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">Modificar usuario</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form class="modal-body">
                    <div class="mb-3">
                        <label for="editUsername" class="form-label">Nombre de usuario</label>
                        <input type="text" class="form-control" id="editUsername">
                    </div>
                    <div class="mb-3">
                        <label for="editUserEmail" class="form-label">Email</label>
                        <input type="email" class="form-control" id="editUserEmail">
                    </div>
                </form>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="submit" class="btn btn-primary" id="modifyUser">Modificar</button>
                </div>
            </div>
        </div>
    </div>


    <script src="./dom/bootstrap.min.js"></script>
    <script src="./dom/utilities.js"></script>
    <script src="./dom/dom.js"></script>
</body>

</html>
